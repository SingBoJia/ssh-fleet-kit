# fleet 配置文件。改好后运行：fleet setup
# 每个 [host 别名] 是一台机器，别名就是以后 ssh 用的名字，例如 ssh web1

[settings]
# 登录服务器用的密钥文件名（放在 ~/.ssh/ 下，不存在会自动生成）
key = id_ed25519_fleet
comment = fleet-key
# 主服务器（可选）。via_hub = yes 时，其他机器默认都经过主服务器跳转
hub = web1
via_hub = no

[host web1]
hostname = 10.0.0.11
port = 22
user = root
# linux（包括 macOS）或 windows
os = linux
# yes：登录这台以后，还能继续 ssh 到其他机器、用你的密钥执行 git pull / push
forward = yes
# 这台机器上的仓库，多个用 ; 分隔
repos = /srv/www/site; /opt/api

[host db1]
hostname = 10.0.0.12
port = 2222
user = admin
os = linux
forward = no

[host app1]
hostname = 192.168.1.20
user = deploy
os = linux
# 只能经过 web1 才能访问的内网机器
jump = web1
forward = yes
repos = /home/deploy/app

[host win-srv]
hostname = 10.0.0.30
user = Administrator
os = windows
forward = no
repos = D:\code\portal

# 每个 [git 别名] 是一个 Git 账号。克隆时用别名代替域名：git clone git@github-work:org/repo.git
[git github-work]
hostname = github.com
key = id_ed25519_work
name = Your Name
email = you@company.com
# 这个目录下的仓库自动使用上面的名字和邮箱
dir = ~/work/

[git github-personal]
hostname = github.com
key = id_ed25519_personal
name = Your Name
email = you@example.com
dir = ~/personal/
